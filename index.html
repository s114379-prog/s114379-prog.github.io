<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超敷衍聊天機器人</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding-top:80px;
}

h1{
    font-size:40px;
}

input{
    width:300px;
    padding:12px;
    font-size:18px;
}

button{
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
}

#reply{
    margin-top:40px;
    font-size:48px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>超敷衍聊天機器人</h1>

<input type="text" id="userInput" placeholder="輸入任何話">

<button onclick="reply()">送出</button>

<div id="reply">...</div>

<script>
function reply(){

    const answers = [
        "恩",
        "行",
        "隨便",
        "所以呢",
        "喔"
    ];

    const random =
        answers[Math.floor(Math.random()*answers.length)];

    document.getElementById("reply").innerText = random;
}
</script>

</body>
</html>
